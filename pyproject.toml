[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-bm"
version = "0.1.0"
description = "PRogram-conditioned Inference of donor-Specific Marrow: donor-specific synthetic bone marrow cells from peripheral blood scRNA-seq."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PRISM authors" }]

dependencies = [
    "torch>=2.1",
    "scvi-tools>=1.2,<1.4",
    "anndata>=0.10",
    "scanpy>=1.10",
    "scikit-learn>=1.3",
    "numpy>=1.26,<2",
    "pandas>=2.0",
    "scipy>=1.11",
    "joblib>=1.3",
    "certifi",
    "celltypist>=1.6",
    "matplotlib>=3.7",
    "umap-learn>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["prism*"]
